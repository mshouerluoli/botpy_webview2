<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miao Bot - QQ Bot Console</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: #0f3460;
    border-radius: 8px;
    margin-bottom: 8px;
}
.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #888;
    animation: none;
}
.status-dot.online {
    background: #4ade80;
    box-shadow: 0 0 10px #4ade80;
    animation: pulse 2s infinite;
}
.status-dot.connecting {
    background: #fbbf24;
    box-shadow: 0 0 10px #fbbf24;
    animation: pulse 1s infinite;
}
.status-dot.offline {
    background: #f87171;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
.status-text {
    font-size: 14px;
    color: #e0e0e0;
}
.main {
    flex: 1;
    display: flex;
    overflow: hidden;
}
.sidebar {
    width: 240px;
    background: #16213e;
    border-right: 1px solid #0f3460;
    padding: 16px;
    overflow-y: auto;
}
.sidebar h2 {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.info-item {
    padding: 10px 12px;
    background: #0f3460;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
}
.info-item .label {
    color: #94a3b8;
    font-size: 11px;
    margin-bottom: 4px;
}
.info-item .value {
    color: #e0e0e0;
    word-break: break-all;
    font-family: 'Consolas', monospace;
    font-size: 12px;
}
.content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.log-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.6;
}
.log-entry {
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.log-entry .timestamp {
    color: #64748b;
    margin-right: 8px;
}
.log-entry.info .msg { color: #93c5fd; }
.log-entry.success .msg { color: #86efac; }
.log-entry.error .msg { color: #fca5a5; }
.log-entry.warning .msg { color: #fcd34d; }
.log-entry.message .msg { color: #c4b5fd; }
.log-container::-webkit-scrollbar {
    width: 8px;
}
.log-container::-webkit-scrollbar-track {
    background: #16213e;
}
.log-container::-webkit-scrollbar-thumb {
    background: #0f3460;
    border-radius: 4px;
}
.log-container::-webkit-scrollbar-thumb:hover {
    background: #1e40af;
}
.tabs {
    display: flex;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
}
.tab {
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
    color: #94a3b8;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
}
.tab:hover {
    color: #e0e0e0;
}
.tab.active {
    color: #fff;
    border-bottom-color: #667eea;
}
.plugin-list {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
}
.plugin-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: #16213e;
    border-radius: 8px;
    margin-bottom: 8px;
    border: 1px solid #0f3460;
}
.plugin-info {
    flex: 1;
}
.plugin-name {
    font-size: 14px;
    color: #e0e0e0;
    margin-bottom: 4px;
}
.plugin-meta {
    font-size: 12px;
    color: #94a3b8;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}
.plugin-meta span {
    display: inline-flex;
}
.plugin-status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
}
.plugin-status.enabled {
    background: #166534;
    color: #86efac;
}
.plugin-status.disabled {
    background: #7f1d1d;
    color: #fca5a5;
}
.plugin-status.priority {
    background: #0f3460;
    color: #94a3b8;
}
.plugin-actions {
    display: flex;
    gap: 8px;
}
.btn {
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
}
.btn-toggle {
    background: #0f3460;
    color: #e0e0e0;
}
.btn-toggle:hover {
    background: #1e40af;
}
.btn-unload {
    background: #7f1d1d;
    color: #fca5a5;
}
.btn-unload:hover {
    background: #991b1b;
}
.btn-reload-all {
    padding: 10px 20px;
    background: #667eea;
    color: #fff;
    margin: 16px;
    font-size: 14px;
}
.btn-reload-all:hover {
    background: #7c3aed;
}
.empty-state {
    text-align: center;
    padding: 40px;
    color: #64748b;
}
</style>
</head>
<body>

<div class="main">
    <div class="sidebar">
        <h2>机器人信息</h2>
        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">未连接</span>
        </div>
        <div class="info-item">
            <div class="label">AppID</div>
            <div class="value" id="appId">-</div>
        </div>
        <div class="info-item">
            <div class="label">昵称</div>
            <div class="value" id="nickname">-</div>
        </div>
        <div class="info-item">
            <div class="label">会话 ID</div>
            <div class="value" id="sessionId">-</div>
        </div>
        <div class="info-item">
            <div class="label">消息数</div>
            <div class="value" id="msgCount">0</div>
        </div>
        <div class="info-item">
            <div class="label">心跳数</div>
            <div class="value" id="heartbeatCount">0</div>
        </div>
    </div>

    <div class="content">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('log')">运行日志</div>
            <div class="tab" onclick="switchTab('plugins')">插件管理</div>
        </div>
        <div class="log-container" id="logContainer">
        </div>
        <div class="plugin-list" id="pluginList" style="display:none;">
            <div class="empty-state">加载插件列表中...</div>
        </div>
    </div>
</div>

<script>
function setStatus(status, text) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    dot.className = 'status-dot ' + status;
    txt.textContent = text;
}

function setInfo(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
}

function addLog(type, message) {
    const container = document.getElementById('logContainer');
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + type;
    const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    entry.innerHTML = '<span class="timestamp">[' + time + ']</span><span class="msg">' + escapeHtml(message) + '</span>';
    container.appendChild(entry);
    
    while (container.children.length > 100) {
        container.removeChild(container.firstChild);
    }
    
    container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

if (window.chrome && chrome.webview) {
    chrome.webview.addEventListener('message', function(event) {
        try {
            const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
            if (data.type === 'log') {
                addLog(data.level || 'info', data.message);
            } else if (data.type === 'status') {
                setStatus(data.status, data.text);
            } else if (data.type === 'info') {
                setInfo(data.id, data.value);
            } else if (data.type === 'message') {
                addLog('message', (data.isGroup ? '[群] ' : '[私聊] ') + data.content);
            } else if (data.type === 'plugins') {
                renderPlugins(data.plugins);
            }
        } catch(e) {
            addLog('info', String(event.data));
        }
    });
}

setStatus('offline', '未连接');
addLog('info', 'Miao Bot 控制台已就绪');
addLog('info', '正在初始化...');

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
        e.preventDefault();
    }
});

function switchTab(tabName) {
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(t => t.classList.remove('active'));
    
    const logContainer = document.getElementById('logContainer');
    const pluginList = document.getElementById('pluginList');
    
    if (tabName === 'log') {
        tabs[0].classList.add('active');
        logContainer.style.display = 'block';
        pluginList.style.display = 'none';
    } else if (tabName === 'plugins') {
        tabs[1].classList.add('active');
        logContainer.style.display = 'none';
        pluginList.style.display = 'block';
        sendCommand('get_plugins');
    }
}

function sendCommand(cmd) {
    if (window.chrome && chrome.webview) {
        chrome.webview.postMessage(cmd);
    }
}

function renderPlugins(plugins) {
    const container = document.getElementById('pluginList');
    container.innerHTML = '';
    
    if (!plugins || plugins.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无可管理的插件</div>';
        return;
    }
    
    plugins.forEach(plugin => {
        const item = document.createElement('div');
        item.className = 'plugin-item';
        
        const statusClass = plugin.enabled ? 'enabled' : 'disabled';
        const statusText = plugin.enabled ? '已启用' : '已停用';
        const toggleText = plugin.enabled ? '停用' : '启用';
        
        item.innerHTML = `
            <div class="plugin-info">
                <div class="plugin-name">${escapeHtml(plugin.name)}<span class="plugin-status ${statusClass}">${statusText}</span><span class="plugin-status priority">优先级: ${plugin.priority || 0}</span></div>
                <div class="plugin-meta">
                    <span>插件名: ${escapeHtml(plugin.display_name)}</span>
                    ${plugin.author ? '<span>作者: ' + escapeHtml(plugin.author) + '</span>' : ''}
                    ${plugin.description ? '<span>简述: ' + escapeHtml(plugin.description) + '</span>' : ''}
                </div>
            </div>
            <div class="plugin-actions">
                <button class="btn btn-toggle" onclick="togglePlugin('${escapeHtml(plugin.name)}')">${toggleText}</button>
                <button class="btn btn-unload" onclick="unloadPlugin('${escapeHtml(plugin.name)}')">卸载</button>
            </div>
        `;
        container.appendChild(item);
    });
    
    const reloadBtn = document.createElement('button');
    reloadBtn.className = 'btn btn-reload-all';
    reloadBtn.textContent = '重新加载所有插件';
    reloadBtn.onclick = reloadPlugins;
    container.appendChild(reloadBtn);
}

function togglePlugin(name) {
    sendCommand('toggle_plugin:' + name);
}

function unloadPlugin(name) {
    if (confirm('确定要卸载插件 ' + name + ' 吗？')) {
        sendCommand('unload_plugin:' + name);
    }
}

function reloadPlugins() {
    if (confirm('确定要重新加载所有插件吗？')) {
        sendCommand('reload_plugins');
    }
}
</script>
</body>
</html>
